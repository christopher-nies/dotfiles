client = "{icon}{delim}"
client_fullscreen = "[{icon}]{delim}"
client_active = "{icon}{delim}"
client_dup = "{icon}{counter_sup}{delim}"
client_dup_active = "*{icon}*{delim}{icon}{counter_unfocused_sup}{delim}"
client_dup_fullscreen = "[{icon}]{delim}{icon}{counter_unfocused_sup}{delim}"
