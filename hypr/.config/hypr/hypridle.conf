general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before any suspend, so the 20-min suspend can't beat the 20-min lock.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'   # avoid having to press a key twice to turn on the display.
}

listener{
    timeout = 1200                              # 20 min.
    on-timeout = bash -c '[ "$(cat /sys/class/power_supply/AC/online 2>/dev/null)" = "1" ] || loginctl lock-session'
}

listener {
    timeout = 600                                # 10 min.
    on-timeout = bash -c '[ "$(cat /sys/class/power_supply/AC/online 2>/dev/null)" = "1" ] || brightnessctl -s set 1'
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

listener {
    timeout = 900                                 # 15 min
    on-timeout = bash -c '[ "$(cat /sys/class/power_supply/AC/online 2>/dev/null)" = "1" ] || hyprctl dispatch "hl.dsp.dpms({ action = \"disable\" })"'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'          # screen on when activity is detected after timeout has fired.
}

listener {
    timeout = 1200                                # 20min
    on-timeout = bash -c '[ "$(cat /sys/class/power_supply/AC/online 2>/dev/null)" = "1" ] || systemctl suspend'
}
